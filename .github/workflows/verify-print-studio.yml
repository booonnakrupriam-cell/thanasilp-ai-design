name: Verify Print Studio
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Thai font and OCR system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-thai-tlwg tesseract-ocr tesseract-ocr-tha tesseract-ocr-eng
      - name: Install Python dependencies and browser
        run: |
          python -m pip install -r requirements.txt playwright
          python -m playwright install chromium --with-deps
      - name: Validate Python and JavaScript syntax
        run: |
          python -m compileall -q app.py print_studio.py interactive_sign_editor.py tests/
          node --input-type=module --check < editor_canvas.js
      - name: Verify print-studio helpers, Thai font and OCR
        run: python tests/smoke.py
      - name: Start Streamlit web server
        run: |
          nohup python -m streamlit run app.py --server.headless=true --server.port=8501 --server.address=127.0.0.1 > /tmp/thanasilp-streamlit.log 2>&1 &
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health; then
              echo "Streamlit responds"; exit 0
            fi
            sleep 2
          done
          cat /tmp/thanasilp-streamlit.log
          exit 1
      - name: Browser test Thai text editor and PNG download
        run: python tests/browser_smoke.py
      - name: Display Streamlit log on failure
        if: failure()
        run: |
          cat /tmp/thanasilp-streamlit.log || true
