name: Check Python syntax and template rendering
on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - '.github/workflows/python-syntax.yml'
  pull_request:
    paths:
      - '**.py'
      - '.github/workflows/python-syntax.yml'
  workflow_dispatch:
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reject Python syntax errors in all modules
        run: python -m compileall -q .
      - name: Install runtime packages for template smoke test
        run: pip install -r requirements.txt
      - name: Smoke-test photoreal memorial ZIP loader and artwork compositor
        run: |
          python - <<'PY'
          from io import BytesIO
          from zipfile import ZipFile, ZIP_DEFLATED
          import json
          from PIL import Image
          from memorial_real import _open_pack, _draw_sign, _add_portrait
          from memorial_pro_art import THEMES
          # Test the real ZIP format with synthetic image bytes (no art packaged in source)
          content=BytesIO()
          mapping={}
          with ZipFile(content,"w",ZIP_DEFLATED) as z:
              for t in THEMES:
                  key=t["id"]
                  width,height=((300,450) if t["shape"]=="portrait" else (450,300))
                  image=Image.new("RGB",(width,height),"#F1E3CB")
                  raw=BytesIO()
                  image.save(raw,format="PNG")
                  z.writestr(key+".png",raw.getvalue())
                  mapping[key]={"file":key+".png","title":t["title"],"shape":t["shape"],
                     "ink":"#32213A","photo_oval":[.12,.16,.35,.69]}
              z.writestr("manifest.json",json.dumps({"pack_version":2,"templates":mapping}))
          pack=content.getvalue()
          meta,cards=_open_pack(pack)
          assert len(cards)==13
          layout={"heading":"ด้วยรักและอาลัย","name":"คุณแม่ตัวอย่าง นามสกุล",
              "born":"ชาตะ  ๕ พฤศจิกายน ๒๔๙๙","died":"มรณะ  ๘ พฤศจิกายน ๒๕๖๙",
              "age":"สิริอายุ  ๗๐ ปี","closing":"ด้วยรักและคิดถึงเสมอ"}
          for t in THEMES:
              target=(700,1000) if t["shape"]=="portrait" else (1100,700)
              source=Image.new("RGBA",(300,450) if t["shape"]=="portrait" else (450,300),"#F1E3CB")
              photo=Image.new("RGB",(350,460),"#8BC2E6")
              result=_draw_sign(source,t["id"],meta["templates"][t["id"]],layout,target,photo)
              assert result.size==target
          print("Photoreal ZIP loader, 13 cards, text/photo compositor: OK")
          PY
      - name: Smoke-test premium memorial gallery (13 live editable layouts)
        run: |
          python - <<'PY'
          from io import BytesIO
          from PIL import Image
          from memorial_pro_art import THEMES, render_memorial_premium
          from memorial_pro import _thumb, _date_th, _age_on
          from datetime import date
          assert len(THEMES) == 13
          text = {
              "heading": "ด้วยรักและอาลัย",
              "name": "คุณแม่ตัวอย่าง นามสกุล",
              "born": "ชาตะ  ๕ พฤศจิกายน ๒๔๙๙",
              "died": "มรณะ  ๘ พฤศจิกายน ๒๕๖๙",
              "age": "สิริอายุ  ๗๐ ปี",
              "closing": "ด้วยรักและระลึกถึงเสมอ",
          }
          for theme in THEMES:
              portrait = theme["shape"]=="portrait"
              width,height = (420,630) if portrait else (700,460)
              output = render_memorial_premium(theme["id"],text,width,height)
              assert output.size == (width,height), theme["id"]
              f=BytesIO()
              output.save(f,format="PNG")
              assert f.tell()>9000, theme["id"]
              card = _thumb(theme["id"])
              assert len(card)>5000,theme["id"]
          assert _age_on(date(1956,11,5),date(2026,11,8)) == 70
          assert "๒๕๖๙" in _date_th(date(2026,11,8))
          print("All 13 memorial templates render PNG and thumbnails correctly")
          PY
      - name: Smoke-test memorial print designs (landscape and portrait)
        run: |
          python - <<'PY'
          from io import BytesIO
          from PIL import Image
          from memorial_studio import render_memorial, _output_size
          values = {
              "heading": "ด้วยรักและอาลัย",
              "name": "คุณแม่ตัวอย่าง นามสกุล",
              "born": "๕ พฤศจิกายน ๒๔๙๙",
              "died": "๘ พฤศจิกายน ๒๕๖๙",
              "age": "๗๐ ปี",
              "closing": "จากครอบครัวและญาติมิตร",
          }
          for width,height in [(1050,700),(650,975),(1200,600)]:
              preview=render_memorial(values,width,height)
              assert preview.size == (width,height)
              assert preview.getbbox() is not None
              temp=BytesIO()
              preview.save(temp,format="PNG")
              assert len(temp.getvalue()) > 15000
          px,py,dpi=_output_size(150,100,150)
          assert 0 < px*py <= 14000000
          print("Memorial layout and PNG export: OK")
          PY
      - name: Smoke-test all Thai sign templates and print output
        run: |
          python - <<'PY'
          from io import BytesIO
          from PIL import Image
          from template_studio import PRESETS, _poster, _actual_size, _card_image
          assert len(PRESETS) >= 14
          for name, preset in PRESETS.items():
              data = _card_image(name)
              with Image.open(BytesIO(data)) as thumb:
                  assert abs((thumb.width / thumb.height) / (preset["w"] / preset["h"]) - 1) < .025, (name, thumb.size)
              fields = {k: preset[k] for k in ("header", "title", "sub", "detail", "footer")}
              output = _poster(preset, fields, 1000, 600)
              assert output.size == (1000, 600), name
              b = BytesIO()
              output.save(b, format="PNG")
              assert b.getbuffer().nbytes > 10000
          w,h,dpi=_actual_size(300, 100, 150)
          assert 0 < w*h <= 16000000
          assert all(k in PRESETS for k in ("history_kathin","history_scholarship","history_memorial","history_sports"))
          print("All historical and standard template previews and exports: OK")
          PY
